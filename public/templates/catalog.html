<div class="panel panel-default"><div class="panel-heading clearfix"><h3 class="panel-title pull-left">{{ label }} Management</h3><a class="btn btn-default btn-sm pull-right" href="#!/products">Back to products</a></div><div class="panel-body"><form class="form-inline" ng-submit="add()"><div class="form-group"><input class="form-control" ng-model="form.name" placeholder="New {{ label | lowercase }} name"></div> <button class="btn btn-success" type="submit">Add {{ label }}</button></form><hr><table class="table table-striped"><thead><tr><th>Name</th><th>Products</th><th>Action</th></tr></thead><tbody><tr ng-repeat="item in items"><td>{{ item.name }}</td><td>{{ item.products_count }}</td><td><button class="btn btn-danger btn-xs" ng-click="remove(item.id)">Delete</button></td></tr><tr ng-if="!items.length"><td colspan="3" class="text-muted">No {{ label | lowercase }} records yet.</td></tr></tbody></table></div></div>
